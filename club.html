<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#061020">
  <title>Club — GLUK Yearbook 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GLUK Yearbook 2026">
  <meta property="og:title" content="GLUK Yearbook 2026 — Great Lakes University of Kisumu">
  <meta property="og:description" content="Browse student profiles, photos and memories from the Great Lakes University of Kisumu.">
  <meta property="og:image" content="https://yearbook-d3f4f.web.app/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">

  <style>
    /* ── Club page ─────────────────────────────── */
    body[data-page="club"] .top-bar { position:static; }        /* only the tab strip stays pinned */

    .club-hero {
      position:relative; color:#fff; text-align:center; padding:18px 18px 22px;
      background:linear-gradient(160deg,var(--navy),var(--navy-mid,#0a2a5e));
      background:linear-gradient(160deg,color-mix(in srgb,var(--cc,#0f4c81) 42%,#061020) 0%,var(--cc,#0f4c81) 115%);
    }
    .club-hero .breadcrumb { display:flex; gap:6px; justify-content:center; font-size:.68rem; color:rgba(255,255,255,.7); margin-bottom:12px; flex-wrap:wrap; }
    .club-hero .breadcrumb a { color:rgba(255,255,255,.8); text-decoration:none; }
    .hero-icon {
      width:68px; height:68px; margin:0 auto 10px; border-radius:50%; background:rgba(255,255,255,.95);
      display:flex; align-items:center; justify-content:center; font-size:2rem; box-shadow:0 6px 20px rgba(0,0,0,.25);
    }
    .club-hero h1 { font-size:1.25rem; font-weight:800; margin:0 0 4px; color:#fff; }
    .hero-desc { font-size:.8rem; opacity:.9; margin:0 0 8px; }
    .hero-cat { display:inline-block; font-size:.62rem; font-weight:800; letter-spacing:.5px; text-transform:uppercase; padding:3px 10px; border-radius:20px; background:rgba(255,255,255,.18); }
    .hero-stats { display:flex; justify-content:center; gap:28px; margin:16px 0 14px; }
    .hero-stats div { display:flex; flex-direction:column; align-items:center; }
    .hero-stats b { font-size:1.15rem; font-weight:800; }
    .hero-stats span { font-size:.62rem; opacity:.85; text-transform:uppercase; letter-spacing:.4px; }
    .join-btn {
      border:none; border-radius:50px; padding:11px 26px; font-size:.82rem; font-weight:800; font-family:inherit; cursor:pointer;
      background:#fff; color:#0b1f3a; box-shadow:0 4px 14px rgba(0,0,0,.25); transition:transform .15s;
    }
    .join-btn:active { transform:scale(.96); }
    .join-btn.joined { background:rgba(255,255,255,.16); color:#fff; box-shadow:none; border:1.5px solid rgba(255,255,255,.7); }

    .club-tabs {
      position:sticky; top:var(--ub-h,0px); z-index:90; display:flex; background:var(--white);
      border-bottom:1px solid var(--gray-100); box-shadow:var(--shadow-sm);
    }
    .club-tab {
      flex:1; padding:13px 4px; border:none; background:none; font-family:inherit; font-size:.78rem; font-weight:700;
      color:var(--gray-400); border-bottom:3px solid transparent; cursor:pointer;
    }
    .club-tab.active { color:var(--navy); border-bottom-color:var(--cc,var(--blue)); }

    .club-main { padding:14px 16px 110px; min-height:50vh; }
    .club-panel { display:none; }
    .club-panel.active { display:block; }
    .muted { color:var(--gray-400); font-size:.8rem; }
    .c-card { background:var(--white); border:1px solid var(--gray-100); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
    .c-card h2 { font-size:.68rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--gray-400); margin:0 0 8px; }
    .c-text { font-size:.86rem; line-height:1.6; color:var(--navy); margin:0; }
    .c-text div + div { margin-top:4px; }
    .lead-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:12px; }
    .lead { text-align:center; }
    .lead-av { width:46px; height:46px; margin:0 auto 6px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.85rem; color:#fff; background:var(--cc,var(--blue)); }
    .lead-nm { font-size:.75rem; font-weight:700; color:var(--navy); line-height:1.25; }
    .lead-role { font-size:.66rem; color:var(--gray-400); margin-top:1px; }
    .contact-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .contact-btn {
      flex:1; min-width:140px; text-align:center; text-decoration:none; padding:11px 12px; border-radius:var(--radius-md);
      font-size:.78rem; font-weight:700; border:1.5px solid var(--gray-200); background:var(--white); color:var(--navy);
    }
    .contact-btn.wa { background:#16a34a; border-color:#16a34a; color:#fff; }
    .edit-info-btn { width:100%; padding:12px; border-radius:var(--radius-md); border:1.5px dashed var(--gray-200); background:none; color:var(--blue); font-weight:800; font-size:.8rem; font-family:inherit; cursor:pointer; }
    .notice-card { border-radius:var(--radius-md); padding:11px 14px; font-size:.78rem; line-height:1.5; margin-bottom:12px; background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; }
    .notice-card.ok { background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
    .notice-card button { display:block; margin-top:8px; padding:7px 12px; border:none; border-radius:8px; background:#ea580c; color:#fff; font-weight:700; font-size:.72rem; font-family:inherit; cursor:pointer; }

    .f-chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; }
    .f-chips::-webkit-scrollbar { display:none; }
    .f-chip { flex-shrink:0; padding:7px 14px; border-radius:50px; border:1.5px solid var(--gray-200); background:var(--white); color:var(--gray-600); font-size:.72rem; font-weight:700; font-family:inherit; cursor:pointer; }
    .f-chip.active { background:var(--cc,var(--navy)); border-color:var(--cc,var(--navy)); color:#fff; }

    .post { background:var(--white); border:1px solid var(--gray-100); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
    .post-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    .badge { font-size:.66rem; font-weight:800; padding:3px 10px; border-radius:20px; background:var(--gray-100); color:var(--gray-600); }
    .badge.t-notice   { background:#fff7ed; color:#c2410c; }
    .badge.t-activity { background:#f0fdf4; color:#15803d; }
    .badge.t-minutes  { background:#eff6ff; color:#1d4ed8; }
    .badge.t-photo    { background:#fdf4ff; color:#a21caf; }
    .pin { font-size:.66rem; font-weight:800; color:#b45309; }
    .post-date { margin-left:auto; font-size:.68rem; color:var(--gray-400); }
    .post-title { font-size:.95rem; font-weight:800; color:var(--navy); margin:0 0 4px; }
    .post-body { font-size:.84rem; line-height:1.6; color:var(--gray-600); margin:0 0 4px; word-break:break-word; }
    .post-body.clamped { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
    .read-more-btn { display:block; border:none; background:none; padding:0 0 8px; font-family:inherit; font-size:.78rem; font-weight:700; color:var(--blue); cursor:pointer; }
    .post-imgs { display:grid; gap:4px; margin:8px 0; border-radius:12px; overflow:hidden; }
    .post-imgs.n1 { grid-template-columns:1fr; }
    .post-imgs.n2, .post-imgs.n4 { grid-template-columns:1fr 1fr; }
    .post-imgs.n3 { grid-template-columns:1fr 1fr 1fr; }
    .pi { position:relative; padding:0; border:none; background:var(--gray-100); cursor:zoom-in; aspect-ratio:1; overflow:hidden; }
    .post-imgs.n1 .pi { aspect-ratio:16/10; }
    .pi img { width:100%; height:100%; object-fit:cover; display:block; }
    .pi .more { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); color:#fff; font-weight:800; font-size:1.2rem; }
    .doc { display:flex; align-items:center; gap:8px; padding:10px 12px; margin:6px 0; border-radius:10px; background:var(--gray-100); color:var(--navy); text-decoration:none; font-size:.78rem; font-weight:700; word-break:break-all; }
    details.att { margin:8px 0; font-size:.78rem; color:var(--gray-600); }
    details.att summary { cursor:pointer; font-weight:700; color:var(--navy); }
    .att-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
    .att-chips span { padding:3px 9px; border-radius:20px; background:var(--gray-100); font-size:.7rem; }
    .post-foot { display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid var(--gray-100); font-size:.7rem; color:var(--gray-400); }
    .post-foot .sp { flex:1; }
    .link-btn { border:none; background:none; font-family:inherit; font-size:.7rem; font-weight:700; cursor:pointer; padding:2px 4px; color:var(--blue); }
    .link-btn.danger { color:var(--danger,#dc2626); }
    .load-more { width:100%; padding:12px; border-radius:var(--radius-md); border:1.5px solid var(--gray-200); background:var(--white); color:var(--navy); font-weight:700; font-size:.8rem; font-family:inherit; cursor:pointer; margin:4px 0 16px; }
    .empty { text-align:center; padding:36px 20px; color:var(--gray-400); font-size:.84rem; line-height:1.6; }
    .empty b { display:block; color:var(--navy); font-size:.95rem; margin:6px 0 2px; }
    .empty .big { font-size:2rem; }
    .skel { height:92px; border-radius:var(--radius-lg); background:linear-gradient(90deg,var(--gray-100),var(--gray-200),var(--gray-100)); background-size:200% 100%; animation:skel 1.2s infinite; margin-bottom:12px; }
    @keyframes skel { to { background-position:-200% 0; } }

    .m-search { width:100%; padding:11px 14px; border-radius:var(--radius-md); border:1.5px solid var(--gray-200); background:var(--white); color:var(--navy); font-size:.84rem; font-family:inherit; box-sizing:border-box; margin-bottom:8px; outline:none; }
    .m-count { font-size:.72rem; color:var(--gray-400); margin:0 2px 10px; }
    .member-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    @media (min-width:640px) { .member-grid { grid-template-columns:repeat(5,1fr); } }
    .member { text-align:center; text-decoration:none; background:var(--white); border:1px solid var(--gray-100); border-radius:var(--radius-md); padding:12px 6px; }
    .m-av { width:52px; height:52px; margin:0 auto 6px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--cc,var(--blue)); color:#fff; font-weight:800; font-size:.9rem; }
    .m-av img { width:100%; height:100%; object-fit:cover; }
    .m-nm { font-size:.72rem; font-weight:700; color:var(--navy); line-height:1.25; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .m-sub { font-size:.62rem; color:var(--gray-400); margin-top:2px; }

    .gal-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
    @media (min-width:640px) { .gal-grid { grid-template-columns:repeat(5,1fr); } }
    .gal-grid button { padding:0; border:none; aspect-ratio:1; overflow:hidden; background:var(--gray-100); cursor:zoom-in; border-radius:6px; }
    .gal-grid img { width:100%; height:100%; object-fit:cover; display:block; }

    .club-fab {
      position:fixed; right:18px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:120; display:none;
      width:56px; height:56px; border-radius:50%; border:none; font-size:1.7rem; line-height:1; cursor:pointer;
      background:var(--cc,var(--blue)); color:#fff; box-shadow:0 8px 24px rgba(0,0,0,.3);
    }
    .club-fab.show { display:block; }

    .lb { position:fixed; inset:0; z-index:9000; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.94); touch-action:pan-y; }
    .lb.open { display:flex; }
    .lb img { max-width:100%; max-height:86vh; object-fit:contain; }
    .lb-x { position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; width:42px; height:42px; border-radius:50%; border:none; background:rgba(255,255,255,.15); color:#fff; font-size:1.1rem; cursor:pointer; }
    .lb-nav { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:64px; border:none; background:rgba(255,255,255,.1); color:#fff; font-size:2rem; cursor:pointer; }
    .lb-prev { left:0; border-radius:0 12px 12px 0; }
    .lb-next { right:0; border-radius:12px 0 0 12px; }
    .lb-count { position:absolute; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center; color:rgba(255,255,255,.8); font-size:.78rem; }

    .sheet-ov { position:fixed; inset:0; z-index:5000; display:none; align-items:flex-end; background:rgba(4,13,30,.78); }
    .sheet-ov.open { display:flex; }
    .sheet { background:var(--white); width:100%; max-height:92dvh; overflow-y:auto; border-radius:var(--radius-xl,24px) var(--radius-xl,24px) 0 0; padding:20px 18px 40px; box-sizing:border-box; }
    .type-row { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px; }
    .type-row button { padding:9px 2px; border-radius:10px; border:1.5px solid var(--gray-200); background:var(--white); color:var(--gray-600); font-size:.68rem; font-weight:700; font-family:inherit; cursor:pointer; }
    .type-row button.active { background:var(--cc,var(--navy)); border-color:var(--cc,var(--navy)); color:#fff; }
    .hint { font-weight:400; color:var(--gray-400); font-size:.7rem; }
    .prev-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
    .prev-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; }
    .att-list { max-height:150px; overflow-y:auto; border:1.5px solid var(--gray-200); border-radius:10px; padding:6px 10px; margin-bottom:8px; }
    .att-list label { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:.8rem; color:var(--navy); }

    [data-theme="dark"] .notice-card { background:#3b2410; color:#fdba74; border-color:#7c2d12; }
    [data-theme="dark"] .notice-card.ok { background:#0f2a1a; color:#86efac; border-color:#14532d; }
    [data-theme="dark"] .badge.t-notice   { background:#3b2410; color:#fdba74; }
    [data-theme="dark"] .badge.t-activity { background:#0f2a1a; color:#86efac; }
    [data-theme="dark"] .badge.t-minutes  { background:#172554; color:#93c5fd; }
    [data-theme="dark"] .badge.t-photo    { background:#3b0a3f; color:#f0abfc; }

    /* Desktop only (860px+): cap and centre the hero, tabs and main content,
       and turn the bottom sheets into centred dialogs like the rest of the app. */
    @media (min-width: 860px) {
      .club-hero, .club-tabs {
        padding-left: max(28px, calc((100% - var(--content-max, 920px)) / 2));
        padding-right: max(28px, calc((100% - var(--content-max, 920px)) / 2));
      }
      .club-main {
        max-width: var(--content-max, 920px);
        margin-left: auto;
        margin-right: auto;
      }
      .sheet-ov { align-items: center; padding: 20px; }
      .sheet {
        width: 100%; max-width: 640px; margin: 0 auto;
        border-radius: var(--radius-xl);
        max-height: calc(100dvh - 40px);
        animation: authIn .32s cubic-bezier(.34,1.2,.64,1) both;
      }
    }
  </style>
</head>
<body data-page="club">

  <div class="user-bar" id="userBar"></div>

  <nav class="top-bar">
    <button class="back-btn" onclick="goBack()" aria-label="Back">‹</button>
    <div style="flex:1">
      <h1 id="navTitle">Club<span class="subtitle">GLUK Yearbook 2026</span></h1>
    </div>
    <button class="profile-icon-btn" id="myProfileBtn" onclick="goToMyProfile()" title="My profile" aria-label="My profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></button>
  </nav>

  <header class="club-hero" id="clubHero">
    <div class="breadcrumb">
      <a href="index.html">Home</a><span>›</span><a href="clubs.html">Clubs</a><span>›</span><span id="bcClub">Club</span>
    </div>
    <div class="hero-icon" id="heroIcon">🏛️</div>
    <h1 id="heroName">Club</h1>
    <p class="hero-desc" id="heroDesc"></p>
    <span class="hero-cat" id="heroCat"></span>
    <div class="hero-stats">
      <div><b id="stMembers">–</b><span>Members</span></div>
      <div><b id="stActs">–</b><span>Activities</span></div>
      <div><b id="stPhotos">–</b><span>Photos</span></div>
    </div>
    <button class="join-btn" id="joinBtn" type="button">＋ Join this club</button>
  </header>

  <div class="club-tabs" id="clubTabs" role="tablist">
    <button class="club-tab active" data-tab="about"   role="tab" type="button">About</button>
    <button class="club-tab"        data-tab="feed"    role="tab" type="button">Feed</button>
    <button class="club-tab"        data-tab="members" role="tab" type="button">Members</button>
    <button class="club-tab"        data-tab="gallery" role="tab" type="button">Gallery</button>
  </div>

  <main class="club-main">

    <section class="club-panel active" id="panel-about">
      <div id="officerBanner"></div>
      <div class="c-card"><h2>About</h2><p class="c-text" id="aboutText"></p></div>
      <div class="c-card"><h2>Meets</h2><div class="c-text" id="meetBody"></div></div>
      <div class="c-card"><h2>Leadership</h2><div id="leadBody"></div></div>
      <div class="contact-row" id="contactRow"></div>
      <div id="setupNote"></div>
      <button class="edit-info-btn" id="editInfoBtn" type="button" style="display:none">✏️ Edit club info</button>
    </section>

    <section class="club-panel" id="panel-feed">
      <div class="f-chips" id="feedChips">
        <button class="f-chip active" data-f="all"      type="button">All</button>
        <button class="f-chip"        data-f="notice"   type="button">Notices</button>
        <button class="f-chip"        data-f="activity" type="button">Activities</button>
        <button class="f-chip"        data-f="minutes"  type="button">Minutes</button>
      </div>
      <div id="feedNote"></div>
      <div id="feedList"></div>
      <div id="feedMore"></div>
    </section>

    <section class="club-panel" id="panel-members">
      <div id="leadSection"></div>
      <input type="search" class="m-search" id="memberSearch" placeholder="🔍  Search members…" autocomplete="off">
      <div class="m-count" id="memberCount"></div>
      <div class="member-grid" id="memberGrid"></div>
    </section>

    <section class="club-panel" id="panel-gallery">
      <div class="gal-grid" id="galGrid"></div>
      <div id="galMore"></div>
    </section>

  </main>

  <button class="club-fab" id="clubFab" type="button" aria-label="New post">＋</button>

  <div class="lb" id="lb" aria-hidden="true">
    <button class="lb-x" id="lbX" type="button" aria-label="Close">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next">›</button>
    <div class="lb-count" id="lbCount"></div>
  </div>

  <!-- New post (officials & admin only) -->
  <div class="sheet-ov" id="postOv">
    <div class="sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">📝 New post</div>
      <div class="type-row" id="typeRow">
        <button type="button" data-type="notice">📢 Notice</button>
        <button type="button" data-type="activity">🎯 Activity</button>
        <button type="button" data-type="minutes">📋 Minutes</button>
        <button type="button" data-type="photo">📸 Photos</button>
      </div>
      <div class="form-group" id="gTitle"><label class="form-label" for="pTitle">Title</label><input class="form-input" type="text" id="pTitle" maxlength="120"></div>
      <div class="form-group" id="gBody"><label class="form-label" for="pBody">Details</label><textarea class="form-textarea" id="pBody" rows="4" maxlength="2000"></textarea></div>
      <div class="form-group" id="gDate"><label class="form-label" for="pDate">Date</label><input class="form-input" type="date" id="pDate"></div>
      <div class="form-group" id="gReport"><label class="form-label" for="pReport" id="reportLbl">Report (PDF or Word)</label><input type="file" id="pReport" accept=".pdf,.doc,.docx"><div class="hint" id="reportName"></div></div>
      <div class="form-group" id="gPhotos"><label class="form-label" for="pPhotos">Photos <span class="hint">(up to 6 · resized automatically)</span></label><input type="file" id="pPhotos" accept="image/*" multiple><div class="prev-grid" id="prevGrid"></div></div>
      <div class="form-group" id="gAtt">
        <label class="form-label">Members who attended</label>
        <div class="att-list" id="attList"></div>
        <label class="form-label" for="pGuests">Guests <span class="hint">(one name per line)</span></label>
        <textarea class="form-textarea" id="pGuests" rows="2" maxlength="1500"></textarea>
      </div>
      <button class="btn-primary" id="postSubmit" type="button">Post</button>
      <button class="btn-secondary" id="postCancel" type="button">Cancel</button>
    </div>
  </div>

  <!-- Edit club info (officials & admin only) -->
  <div class="sheet-ov" id="infoOv">
    <div class="sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">✏️ Edit club info</div>
      <div class="form-group"><label class="form-label" for="iAbout">About the club</label><textarea class="form-textarea" id="iAbout" rows="5" maxlength="800" placeholder="What does your club do? Who can join?"></textarea></div>
      <div class="form-group"><label class="form-label" for="iDays">Meeting days &amp; time</label><input class="form-input" type="text" id="iDays" maxlength="80" placeholder="e.g. Thursdays, 5:00 pm"></div>
      <div class="form-group"><label class="form-label" for="iPlace">Meeting place</label><input class="form-input" type="text" id="iPlace" maxlength="80" placeholder="e.g. Lecture Hall 2"></div>
      <div class="form-group"><label class="form-label" for="iWa">Club WhatsApp number</label><input class="form-input" type="tel" id="iWa" maxlength="20" placeholder="e.g. 0712 345 678"></div>
      <div class="form-group"><label class="form-label" for="iMail">Club email</label><input class="form-input" type="email" id="iMail" maxlength="80"></div>
      <button class="btn-primary" id="infoSave" type="button">💾 Save</button>
      <button class="btn-secondary" id="infoCancel" type="button">Cancel</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>

  <script>
  (function () {
    'use strict';

    const $  = id => document.getElementById(id);
    const E  = s => window.escHtml(s);
    const toast = (m, d) => window.showToast(m, d);

    const CLUB = new URLSearchParams(location.search).get('club') || 'GLUK Students Association';
    const META = window.clubMeta(CLUB) || { icon: '🏛️', color: '#0f4c81', cat: 'Club', desc: 'GLUK club and society' };

    const PAGE_SIZE = 15, MAX_PHOTOS = 6, GALLERY_STEP = 30, MAX_DOC_MB = 10;
    const ROLE_ORDER = ['Patron', 'Chairperson', 'Vice chairperson', 'Secretary', 'Treasurer', 'Organizing secretary', 'Officer'];
    const TYPE_LABEL = { notice: '📢 Notice', activity: '🎯 Activity', minutes: '📋 Minutes', photo: '📸 Photos' };

    let _user = null, _me = null;
    let _info = null, _officers = [], _setupNeeded = false;
    let _members = [], _membersReady = Promise.resolve();
    let _tab = 'about', _filter = 'all', _feedFrom = 0, _feedBusy = false, _feedOnce = false;
    let _gallery = [], _galShown = 0;
    let _ptype = 'notice', _pfiles = [];
    const _postImgs = {};

    /* ── small helpers ─────────────────────────────── */
    const fmtDate  = d => { try { return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } };
    const ini      = n => (String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('') || '?').toUpperCase();
    const isImg    = u => /\.(jpe?g|png|gif|webp|avif|heic)$/i.test(String(u).split('?')[0]);
    const fileName = u => { try { return decodeURIComponent(String(u).split('?')[0].split('/').pop()).replace(/^\d+_[a-z0-9]{1,6}_/i, '').replace(/^\d+_/, ''); } catch (e) { return 'Document'; } };
    const slug     = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const rank     = r => { const i = ROLE_ORDER.indexOf(r); return i < 0 ? 99 : i; };
    const missing  = err => !!err && /schema cache|does not exist|PGRST205|42P01/i.test((err.message || '') + ' ' + (err.code || ''));
    const emailOk  = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);

    const isAdminUser = () => !!(_user && typeof ADMIN_EMAIL !== 'undefined' && _user.email === ADMIN_EMAIL);
    // Officials' emails are private, so the secure service tells us whether this person is one
    let _myOfficer = null;
    async function loadMyOfficer() {
      _myOfficer = null;
      if (!_user || !_user.email) return;
      try { _myOfficer = (await window.gApi('club.officer.me', { club: CLUB })).officer || null; }
      catch (e) { console.warn('[club officer]', e); }
    }
    const myOfficer   = () => (_user ? _myOfficer : null);
    const canManage = () => isAdminUser() || (!!myOfficer() && !!_user.emailVerified);

    function syncHeader() {
      const ub = $('userBar');
      let h = 0;
      if (ub) { const pos = getComputedStyle(ub).position; if (pos === 'sticky' || pos === 'fixed') h = ub.offsetHeight; }
      document.documentElement.style.setProperty('--ub-h', h + 'px');
    }

    function lockScroll(on) { document.documentElement.style.overflow = on ? 'hidden' : ''; }

    /* ── hero ──────────────────────────────────────── */
    function paintHero() {
      document.title = `${CLUB} — GLUK Yearbook 2026`;
      $('clubHero').style.setProperty('--cc', META.color);
      document.documentElement.style.setProperty('--cc', META.color);
      $('heroIcon').textContent = META.icon;
      $('heroName').textContent = CLUB;
      $('heroDesc').textContent = META.desc;
      $('heroCat').textContent  = META.cat;
      $('bcClub').textContent   = CLUB;
      const t = $('navTitle');
      if (t) t.innerHTML = `${E(CLUB)}<span class="subtitle">Clubs &amp; Societies</span>`;
    }

    /* ── tabs ──────────────────────────────────────── */
    function setTab(t) {
      _tab = t;
      document.querySelectorAll('.club-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
      document.querySelectorAll('.club-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + t));
      if (t === 'feed' && !_feedOnce) { _feedOnce = true; loadFeed(true); }
      paintFab();
      try { history.replaceState(null, '', '#' + t); } catch (e) {}
      const top = $('clubTabs').offsetTop - (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--ub-h')) || 0);
      if (window.scrollY > top) window.scrollTo(0, top);
    }

    function paintFab() {
      const show = canManage() && (_tab === 'feed' || _tab === 'gallery');
      $('clubFab').classList.toggle('show', show);
    }

    /* ── About tab ─────────────────────────────────── */
    function leadHTML() {
      if (!_officers.length) return '<p class="muted">No officials have been added yet.</p>';
      const sorted = [..._officers].sort((a, b) => rank(a.role) - rank(b.role));
      return `<div class="lead-grid">${sorted.map(o => {
        const nm = o.officer_name || 'Club official';
        return `<div class="lead"><div class="lead-av">${E(ini(nm))}</div><div class="lead-nm">${E(nm)}</div><div class="lead-role">${E(o.role || 'Officer')}</div></div>`;
      }).join('')}</div>`;
    }

    function paintOfficerBanner() {
      const el = $('officerBanner'); if (!el) return;
      const o = myOfficer();
      if (o && !_user.emailVerified && !isAdminUser()) {
        el.innerHTML = `<div class="notice-card">You are listed as <b>${E(o.role || 'Officer')}</b> of this club. Verify your email to post and edit.
          <button type="button" id="verifyBtn">Send verification email</button></div>`;
        $('verifyBtn').onclick = async () => {
          try { await _user.sendEmailVerification(); toast('Verification email sent. Check your inbox and spam folder.', 4000); }
          catch (e) { toast('Could not send the email right now. Try again later.'); }
        };
      } else if (canManage()) {
        el.innerHTML = `<div class="notice-card ok">You can post and edit for this club${o ? ' as ' + E(o.role || 'Officer') : ' as admin'}.</div>`;
      } else { el.innerHTML = ''; }
    }

    function paintAbout() {
      const about = _info && _info.about;
      $('aboutText').innerHTML = about
        ? E(about).replace(/\n/g, '<br>')
        : `<span class="muted">${canManage() ? 'Add a short description so students know what this club is about.' : 'This club has not added a description yet.'}</span>`;

      const days = _info && _info.meeting_days, place = _info && _info.meeting_place;
      $('meetBody').innerHTML = (days || place)
        ? `${days ? `<div>🗓 ${E(days)}</div>` : ''}${place ? `<div>📍 ${E(place)}</div>` : ''}`
        : '<span class="muted">Meeting times have not been shared yet.</span>';

      $('leadBody').innerHTML = leadHTML();

      const wa = window.waLink(_info && _info.contact_whatsapp);
      const mail = _info && _info.contact_email && emailOk(_info.contact_email) ? _info.contact_email : '';
      $('contactRow').innerHTML =
        (wa   ? `<a class="contact-btn wa" href="${E(wa)}" target="_blank" rel="noopener noreferrer">💬 Message the club</a>` : '') +
        (mail ? `<a class="contact-btn" href="mailto:${E(mail)}">✉️ Email the club</a>` : '');

      $('setupNote').innerHTML = (_setupNeeded && isAdminUser())
        ? '<div class="notice-card">Club tables were not found. Run <b>clubs-upgrade.sql</b> in Supabase (SQL Editor) to turn on officials, club info and pinned posts.</div>' : '';
      $('editInfoBtn').style.display = canManage() ? 'block' : 'none';
      paintOfficerBanner();
      paintLead2();
    }

    function paintLead2() {
      const el = $('leadSection'); if (!el) return;
      el.innerHTML = _officers.length ? `<div class="c-card"><h2>Leadership</h2>${leadHTML()}</div>` : '';
    }

    async function loadInfo() {
      try {
        const [a, b] = await Promise.all([
          supabase.from('club_info').select('*').eq('club_name', CLUB).maybeSingle(),
          supabase.from('club_officers_public').select('*').eq('club_name', CLUB).order('id', { ascending: true }),
        ]);
        _setupNeeded = missing(a.error) || missing(b.error);
        _info = a.data || null;
        _officers = b.data || [];
      } catch (e) { console.warn('[club info]', e); }
      paintAbout(); paintFab();
    }

    /* ── Members ───────────────────────────────────── */
    async function loadMembers() {
      const cols = 'id,name,photo_url,classyear,dept,isanonymous';
      let rows = null;
      try {
        const { data, error } = await supabase.from('profiles_public').select(cols)
          .contains('clubs', [CLUB]).order('name', { ascending: true }).limit(1000);
        if (!error && data) rows = data;
      } catch (e) {}
      if (!rows) {                                   // older data stored as text: filter in the browser instead
        rows = [];
        const PAGE = 1000;
        for (let from = 0; from < 50000; from += PAGE) {
          const { data, error } = await supabase.from('profiles_public').select(cols + ',clubs')
            .order('id', { ascending: true }).range(from, from + PAGE - 1);
          if (error) throw error;
          (data || []).forEach(r => { if (window.parseClubField(r.clubs).some(c => c.toLowerCase() === CLUB.toLowerCase())) rows.push(r); });
          if (!data || data.length < PAGE) break;
        }
        rows.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      }
      _members = rows.filter(r => !r.isanonymous);
      $('stMembers').textContent = _members.length;
      paintMembers();
    }

    function paintMembers() {
      const q = ($('memberSearch').value || '').trim().toLowerCase();
      const list = q ? _members.filter(m => String(m.name || '').toLowerCase().includes(q)) : _members;
      $('memberCount').textContent = _members.length ? `${list.length} of ${_members.length} member${_members.length === 1 ? '' : 's'}` : '';
      $('memberGrid').innerHTML = '';
      if (!list.length) {
        $('memberGrid').innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">🌱</div><b>${_members.length ? 'No members match' : 'No members yet'}</b>${_members.length ? '' : 'Be the first: tap “Join this club” at the top.'}</div>`;
        return;
      }
      $('memberGrid').innerHTML = list.map(m => {
        const photo = window.safeUrl(m.photo_url);
        return `<a class="member" href="profile.html?id=${Number(m.id)}">
          <div class="m-av">${photo ? `<img src="${E(photo)}" alt="${E(m.name)}" loading="lazy">` : E(ini(m.name))}</div>
          <div class="m-nm">${E(m.name)}</div>
          <div class="m-sub">${m.classyear ? 'Class of ' + E(m.classyear) : '&nbsp;'}</div>
        </a>`;
      }).join('');
    }

    /* ── Join / leave ──────────────────────────────── */
    async function loadMe() {
      if (!_user) { _me = null; return; }
      try {
        const { data } = await supabase.from('profiles_public').select('id,clubs').eq('uid', _user.uid).limit(1);
        _me = (data && data[0]) ? { id: data[0].id, clubs: window.parseClubField(data[0].clubs) } : null;
      } catch (e) { _me = null; }
    }
    const isMember = () => !!_me && _me.clubs.some(c => c.toLowerCase() === CLUB.toLowerCase());
    function paintJoin() {
      const b = $('joinBtn');
      b.textContent = isMember() ? '✓ Joined' : '＋ Join this club';
      b.classList.toggle('joined', isMember());
    }
    async function handleJoin() {
      _user = _user || auth.currentUser;          // sign-in just finished: our own listener may not have fired yet
      await loadMe();
      if (!_me) {
        toast('Create your yearbook profile first, then you can join clubs here 🎓', 3500);
        setTimeout(() => { location.href = 'profiles.html?action=add'; }, 1500);
        return;
      }
      const leaving = isMember();
      if (leaving && !confirm(`Leave ${CLUB}?`)) return;
      const next = leaving ? _me.clubs.filter(c => c.toLowerCase() !== CLUB.toLowerCase()) : [..._me.clubs, CLUB];
      try {
        await window.apiWrite('profile.update', { id: _me.id, patch: { clubs: next } }, async () => {
          const { error } = await supabase.from('profiles').update({ clubs: next }).eq('id', _me.id).eq('uid', _user.uid);
          if (error) throw error;
          return {};
        });
      } catch (error) { console.warn('[join]', error); toast(error.data ? error.message : 'Could not update your clubs. Please try again.'); return; }
      _me.clubs = next;
      try { sessionStorage.removeItem('gluk-club-stats'); } catch (e) {}
      paintJoin(); loadMembers();
      toast(leaving ? 'You left the club' : 'Welcome to the club! 🎉');
    }

    /* ── Feed ──────────────────────────────────────── */
    async function fetchPosts(filter, from) {
      const build = withPinned => {
        let q = supabase.from('club_posts').select('*').eq('club_name', CLUB);
        if (filter !== 'all') q = q.eq('type', filter);
        else if (!_user) q = q.neq('type', 'minutes');
        if (withPinned) q = q.order('pinned', { ascending: false, nullsFirst: false });
        return q.order('created_at', { ascending: false }).range(from, from + PAGE_SIZE - 1);
      };
      let res = await build(true);
      if (res.error && /pinned/i.test(res.error.message || '')) res = await build(false);   // pinned column not added yet
      if (res.error) throw res.error;
      return res.data || [];
    }

    function postHTML(p) {
      const urls = (Array.isArray(p.file_urls) ? p.file_urls : []).map(window.safeUrl).filter(Boolean);
      const imgs = urls.filter(isImg), docs = urls.filter(u => !isImg(u));
      const id = Number(p.id);
      _postImgs[id] = imgs;
      const mine = !!_user && p.created_by === _user.uid;
      const att = Array.isArray(p.attendees) ? p.attendees : [];
      const type = TYPE_LABEL[p.type] ? p.type : 'notice';
      return `<article class="post">
        <div class="post-top">
          <span class="badge t-${type}">${E(TYPE_LABEL[type])}</span>
          ${p.pinned ? '<span class="pin">📌 Pinned</span>' : ''}
          <span class="post-date">${E(fmtDate(p.post_date || p.created_at))}</span>
        </div>
        ${p.title ? `<h3 class="post-title">${E(p.title)}</h3>` : ''}
        ${p.body ? (() => {
          const long = p.body.length > 260 || (p.body.match(/\n/g) || []).length > 3;
          return `<p class="post-body${long ? ' clamped' : ''}" id="pb-${id}">${E(p.body).replace(/\n/g, '<br>')}</p>${long ? `<button type="button" class="read-more-btn" data-act="more" data-id="${id}">Read more</button>` : ''}`;
        })() : ''}
        ${imgs.length ? `<div class="post-imgs n${Math.min(imgs.length, 4)}">${imgs.slice(0, 4).map((u, i) =>
          `<button type="button" class="pi" data-post="${id}" data-i="${i}"><img src="${E(u)}" alt="" loading="lazy">${i === 3 && imgs.length > 4 ? `<span class="more">+${imgs.length - 4}</span>` : ''}</button>`).join('')}</div>` : ''}
        ${docs.map(u => `<a class="doc" href="${E(u)}" target="_blank" rel="noopener noreferrer">📄 ${E(fileName(u))}</a>`).join('')}
        ${att.length ? `<details class="att"><summary>👥 ${att.length} in attendance</summary><div class="att-chips">${att.map(n => `<span>${E(n)}</span>`).join('')}</div></details>` : ''}
        <div class="post-foot">
          <span>by ${E(p.author_name || 'Club official')}</span><span class="sp"></span>
          ${canManage() ? `<button type="button" class="link-btn" data-act="pin" data-id="${id}" data-pinned="${p.pinned ? 1 : 0}">${p.pinned ? 'Unpin' : '📌 Pin'}</button>` : ''}
          ${(canManage() || mine) ? `<button type="button" class="link-btn danger" data-act="del" data-id="${id}">Delete</button>` : ''}
        </div>
      </article>`;
    }

    function feedEmptyHTML() {
      const nm = { all: 'posts', notice: 'notices', activity: 'activities', minutes: 'minutes' }[_filter];
      return `<div class="empty"><div class="big">📭</div><b>No ${nm} yet</b>${canManage()
        ? 'Tap the ＋ button to share the first update.' : 'Club officials share notices, activities and minutes here.'}</div>`;
    }

    async function loadFeed(reset) {
      if (_feedBusy) return;
      const list = $('feedList'), more = $('feedMore');
      if (reset) { _feedFrom = 0; more.innerHTML = ''; list.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; }
      $('feedNote').innerHTML = (!_user && _filter === 'all')
        ? '<p class="muted" style="margin:0 2px 10px">🔒 Minutes are visible to signed-in users only.</p>' : '';

      if (!_user && _filter === 'minutes') {
        list.innerHTML = '<div class="empty"><div class="big">🔒</div><b>Minutes are for signed-in users</b>Sign in to read this club’s meeting minutes.<br><br><button type="button" class="btn-primary" id="lockSignIn" style="max-width:200px">Sign in</button></div>';
        $('lockSignIn').onclick = () => openAuthModal(() => { _user = _user || auth.currentUser; loadFeed(true); }, 'login');
        return;
      }
      _feedBusy = true;
      try {
        const rows = await fetchPosts(_filter, _feedFrom);
        if (reset) list.innerHTML = '';
        if (!rows.length && _feedFrom === 0) list.innerHTML = feedEmptyHTML();
        else list.insertAdjacentHTML('beforeend', rows.map(postHTML).join(''));
        _feedFrom += rows.length;
        more.innerHTML = rows.length === PAGE_SIZE ? '<button type="button" class="load-more" id="loadMoreBtn">Load more</button>' : '';
      } catch (e) {
        console.warn('[feed]', e);
        list.innerHTML = `<div class="empty"><div class="big">⚠️</div><b>Could not load posts</b>${missing(e) ? 'The club tables are not set up yet.' : 'Check your connection and try again.'}<br><br><button type="button" class="btn-secondary" id="feedRetry" style="max-width:160px">Try again</button></div>`;
        const r = $('feedRetry'); if (r) r.onclick = () => loadFeed(true);
      } finally { _feedBusy = false; }
    }

    async function deletePost(id) {
      if (!confirm('Delete this post? This cannot be undone.')) return;
      try {
        await window.apiWrite('club.post.delete', { id }, async () => {
          let q = supabase.from('club_posts').delete().eq('id', id);
          if (!canManage()) q = q.eq('created_by', _user.uid);
          const { error } = await q;
          if (error) throw error;
          return {};
        });
      } catch (e) { toast(e.status === 403 ? 'You cannot delete that post.' : 'Could not delete the post.'); return; }
      toast('Post deleted 🗑'); refreshAll();
    }
    async function togglePin(id, pinned) {
      try {
        await window.apiWrite('club.post.pin', { id, pinned: !pinned }, async () => {
          const { error } = await supabase.from('club_posts').update({ pinned: !pinned }).eq('id', id);
          if (error) throw error;
          return {};
        });
      } catch (error) { toast(/pinn/i.test(error.message || '') ? 'Run clubs-upgrade.sql to turn on pinning.' : 'Could not pin the post.', 3500); return; }
      loadFeed(true);
    }

    /* ── Gallery + counts ──────────────────────────── */
    async function loadGallery() {
      try {
        const { data, error } = await supabase.from('club_posts').select('file_urls,type,created_at')
          .eq('club_name', CLUB).neq('type', 'minutes').order('created_at', { ascending: false }).limit(200);
        if (error) throw error;
        _gallery = [];
        (data || []).forEach(p => (Array.isArray(p.file_urls) ? p.file_urls : []).map(window.safeUrl).filter(u => u && isImg(u)).forEach(u => _gallery.push(u)));
      } catch (e) { console.warn('[gallery]', e); _gallery = []; }
      _galShown = Math.min(GALLERY_STEP, _gallery.length);
      $('stPhotos').textContent = _gallery.length;
      paintGallery();
    }
    function paintGallery() {
      const grid = $('galGrid');
      if (!_gallery.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">📸</div><b>No photos yet</b>${canManage() ? 'Tap ＋ to add photos from your activities.' : 'Photos from club activities will appear here.'}</div>`;
        $('galMore').innerHTML = ''; return;
      }
      grid.innerHTML = _gallery.slice(0, _galShown).map((u, i) => `<button type="button" data-i="${i}"><img src="${E(u)}" alt="" loading="lazy"></button>`).join('');
      $('galMore').innerHTML = _galShown < _gallery.length
        ? `<button type="button" class="load-more" id="galMoreBtn" style="margin-top:12px">Show more (${_gallery.length - _galShown} left)</button>` : '';
    }
    async function loadActs() {
      try {
        const { count, error } = await supabase.from('club_posts').select('id', { count: 'exact', head: true })
          .eq('club_name', CLUB).eq('type', 'activity');
        $('stActs').textContent = error ? '0' : (count || 0);
      } catch (e) { $('stActs').textContent = '0'; }
    }
    function refreshAll() { loadFeed(true); loadGallery(); loadActs(); try { sessionStorage.removeItem('gluk-club-stats'); } catch (e) {} }

    /* ── Lightbox ──────────────────────────────────── */
    let _lbList = [], _lbI = 0;
    function showLb() {
      $('lbImg').src = _lbList[_lbI];
      $('lbCount').textContent = _lbList.length > 1 ? `${_lbI + 1} / ${_lbList.length}` : '';
      const v = _lbList.length > 1 ? 'visible' : 'hidden';
      $('lbPrev').style.visibility = v; $('lbNext').style.visibility = v;
    }
    function openLb(list, i) {
      if (!list || !list.length) return;
      _lbList = list; _lbI = Math.max(0, Math.min(i, list.length - 1));
      showLb(); $('lb').classList.add('open'); lockScroll(true);
    }
    function closeLb() { $('lb').classList.remove('open'); $('lbImg').src = ''; lockScroll(false); }
    const lbStep = d => { if (_lbList.length > 1) { _lbI = (_lbI + d + _lbList.length) % _lbList.length; showLb(); } };

    /* ── Photo resizing (saves mobile data) ────────── */
    function viaImg(file) {
      return new Promise((res, rej) => {
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); res(img); };
        img.onerror = e => { URL.revokeObjectURL(url); rej(e); };
        img.src = url;
      });
    }
    async function compress(file, maxDim = 1600, quality = 0.82) {
      if (!/^image\//.test(file.type) || file.type === 'image/gif') return file;
      try {
        const bmp = (window.createImageBitmap ? await createImageBitmap(file).catch(() => viaImg(file)) : await viaImg(file));
        const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
        const s = Math.min(1, maxDim / Math.max(w0, h0));
        const c = document.createElement('canvas');
        c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
        if (!blob || blob.size >= file.size) return file;
        return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
      } catch (e) { return file; }
    }
    async function uploadFile(file) {
      // ask the secure service for a one-time upload slot (only this club's officials get one) …
      let slot = null;
      try { slot = await window.gApi('upload.sign', { bucket: 'club-files', club: CLUB, contentType: file.type || 'application/octet-stream', filename: file.name, size: file.size }); }
      catch (e) { if (!(e.unreachable && !window.GLUK_API.strict)) throw e; }
      if (slot) {
        const up = await window.putToSlot('club-files', slot, file, file.type || 'application/octet-stream');
        if (up.error) throw up.error;
        return slot.publicUrl;
      }
      // … or, while the service is not reachable yet, the old direct upload
      const safe = file.name.replace(/[^a-zA-Z0-9._-]+/g, '_').slice(-60);
      const path = `${slug(CLUB)}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}_${safe}`;
      const { error } = await supabase.storage.from('club-files').upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
      if (error) throw error;
      return supabase.storage.from('club-files').getPublicUrl(path).data.publicUrl;
    }

    /* ── New post ──────────────────────────────────── */
    function setType(t) {
      _ptype = t;
      document.querySelectorAll('#typeRow button').forEach(b => b.classList.toggle('active', b.dataset.type === t));
      const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
      show('gTitle', t !== 'photo');
      show('gBody', t !== 'photo');
      show('gDate', t === 'activity' || t === 'minutes');
      show('gReport', t === 'activity' || t === 'minutes');
      show('gAtt', t === 'activity' || t === 'minutes');
      show('gPhotos', t !== 'minutes');
      $('reportLbl').textContent = t === 'minutes' ? 'Upload the minutes (PDF or Word)' : 'Activity report (PDF or Word)';
      $('pTitle').placeholder = { notice: 'e.g. Weekly meeting moved to Friday', activity: 'e.g. Blood donation drive', minutes: 'e.g. Meeting minutes, 5 Sep' }[t] || '';
    }
    function renderPreviews() {
      $('prevGrid').innerHTML = _pfiles.map(f => `<img src="${URL.createObjectURL(f)}" alt="">`).join('');
    }
    async function openPost(type) {
      if (!canManage()) { toast('Only club officials can post here.'); return; }
      $('pTitle').value = ''; $('pBody').value = ''; $('pGuests').value = '';
      $('pDate').value = new Date().toISOString().slice(0, 10);
      $('pReport').value = ''; $('reportName').textContent = ''; $('pPhotos').value = '';
      _pfiles = []; renderPreviews();
      $('postSubmit').disabled = false; $('postSubmit').textContent = 'Post';
      setType(type || 'notice');
      await _membersReady;
      $('attList').innerHTML = _members.length
        ? _members.slice(0, 400).map(m => `<label><input type="checkbox" value="${E(m.name)}"> ${E(m.name)}</label>`).join('')
        : '<span class="muted">No members listed yet. Add guests below.</span>';
      $('postOv').classList.add('open'); lockScroll(true);
    }
    function closePost() { $('postOv').classList.remove('open'); lockScroll(false); }

    async function submitPost() {
      if (!canManage()) return;
      const title = $('pTitle').value.trim(), body = $('pBody').value.trim();
      const date = $('pDate').value || new Date().toISOString().slice(0, 10);
      const report = $('pReport').files[0] || null;
      const t = _ptype;
      if (t === 'notice'   && !title && !body)       return toast('Add a title or some details.');
      if (t === 'activity' && !title)                return toast('Give the activity a title.');
      if (t === 'minutes'  && !title)                return toast('Give the minutes a title.');
      if (t === 'minutes'  && !body && !report)      return toast('Add the minutes text or upload the file.');
      if (t === 'photo'    && !_pfiles.length)       return toast('Choose at least one photo.');
      if (report && report.size > MAX_DOC_MB * 1048576) return toast(`That file is over ${MAX_DOC_MB} MB.`);

      const btn = $('postSubmit'); btn.disabled = true;
      try {
        const urls = [], total = _pfiles.length + (report ? 1 : 0); let n = 0;
        for (const f of _pfiles) { btn.textContent = `Uploading ${++n}/${total}…`; urls.push(await uploadFile(await compress(f))); }
        if (report) { btn.textContent = `Uploading ${++n}/${total}…`; urls.push(await uploadFile(report)); }

        const ticked = Array.from(document.querySelectorAll('#attList input:checked')).map(i => i.value);
        const guests = $('pGuests').value.split(/[\n,]/).map(s => s.trim().slice(0, 80)).filter(Boolean);
        const attendees = (t === 'activity' || t === 'minutes') ? [...ticked, ...guests].slice(0, 300) : [];

        const o = myOfficer();
        const nm = _user.displayName || String(_user.email || '').split('@')[0];
        btn.textContent = 'Saving…';
        const authorName = o ? `${nm} · ${o.role || 'Officer'}` : nm;
        await window.apiWrite('club.post.create', { club: CLUB, type: t, title, body, post_date: date, file_urls: urls, attendees, author_name: authorName }, async () => {
          const { error } = await supabase.from('club_posts').insert({
            club_name: CLUB, type: t, title: title || null, body: body || null, post_date: date,
            file_urls: urls, attendees, created_by: _user.uid, author_name: authorName,
          });
          if (error) throw error;
          return {};
        });
        closePost(); toast('Posted ✅');
        _filter = t === 'photo' ? 'all' : t;
        document.querySelectorAll('#feedChips .f-chip').forEach(c => c.classList.toggle('active', c.dataset.f === _filter));
        _feedOnce = true; refreshAll(); setTab('feed');
      } catch (e) {
        console.warn('[post]', e);
        toast(e && e.data ? e.message : 'Could not post. Check your connection and try again.', 3500);
        btn.disabled = false; btn.textContent = 'Post';
      }
    }

    /* ── Edit club info ────────────────────────────── */
    function openInfo() {
      if (!canManage()) return;
      $('iAbout').value = (_info && _info.about) || '';
      $('iDays').value  = (_info && _info.meeting_days) || '';
      $('iPlace').value = (_info && _info.meeting_place) || '';
      $('iWa').value    = (_info && _info.contact_whatsapp) || '';
      $('iMail').value  = (_info && _info.contact_email) || '';
      $('infoOv').classList.add('open'); lockScroll(true);
    }
    function closeInfo() { $('infoOv').classList.remove('open'); lockScroll(false); }
    async function saveInfo() {
      const wa = $('iWa').value.trim(), mail = $('iMail').value.trim();
      if (wa && !window.waLink(wa)) return toast('That WhatsApp number does not look right.');
      if (mail && !emailOk(mail))   return toast('That email address does not look right.');
      const row = {
        club_name: CLUB, about: $('iAbout').value.trim() || null, meeting_days: $('iDays').value.trim() || null,
        meeting_place: $('iPlace').value.trim() || null, contact_whatsapp: wa || null, contact_email: mail || null,
        updated_by: _user.uid, updated_at: new Date().toISOString(),
      };
      const btn = $('infoSave'); btn.disabled = true;
      let error = null;
      try {
        await window.apiWrite('club.info.save', { club: CLUB, info: { about: row.about, meeting_days: row.meeting_days, meeting_place: row.meeting_place, contact_whatsapp: row.contact_whatsapp, contact_email: row.contact_email } }, async () => {
          const r = await supabase.from('club_info').upsert(row, { onConflict: 'club_name' });
          if (r.error) throw r.error;
          return {};
        });
      } catch (e) { error = e; }
      btn.disabled = false;
      if (error) { console.warn('[info]', error); toast(error.data ? error.message : (missing(error) ? 'Run clubs-upgrade.sql in Supabase first.' : 'Could not save. Please try again.'), 3500); return; }
      _info = row; closeInfo(); paintAbout(); toast('Club info saved ✅');
    }

    /* ── Wiring ────────────────────────────────────── */
    document.querySelectorAll('.club-tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
    $('feedChips').addEventListener('click', e => {
      const c = e.target.closest('.f-chip'); if (!c) return;
      _filter = c.dataset.f;
      document.querySelectorAll('#feedChips .f-chip').forEach(x => x.classList.toggle('active', x === c));
      loadFeed(true);
    });
    $('feedList').addEventListener('click', e => {
      const pi = e.target.closest('.pi');
      if (pi) { openLb(_postImgs[pi.dataset.post] || [], +pi.dataset.i); return; }
      const b = e.target.closest('[data-act]'); if (!b) return;
      const id = +b.dataset.id;
      if (b.dataset.act === 'del') deletePost(id);
      else if (b.dataset.act === 'pin') togglePin(id, b.dataset.pinned === '1');
      else if (b.dataset.act === 'more') {
        const p = $('pb-' + id); if (!p) return;
        const collapsed = p.classList.toggle('clamped');   // toggle() returns true when the class is now present (i.e. collapsed)
        b.textContent = collapsed ? 'Read more' : 'Show less';
      }
    });
    $('feedMore').addEventListener('click', e => { if (e.target.closest('#loadMoreBtn')) loadFeed(false); });
    $('galGrid').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) openLb(_gallery, +b.dataset.i); });
    $('galMore').addEventListener('click', e => {
      if (e.target.closest('#galMoreBtn')) { _galShown = Math.min(_galShown + GALLERY_STEP, _gallery.length); paintGallery(); }
    });
    $('memberSearch').addEventListener('input', paintMembers);
    $('joinBtn').addEventListener('click', () => requireAuth(handleJoin, 'login'));
    $('clubFab').addEventListener('click', () => openPost(_tab === 'gallery' ? 'photo' : (_filter === 'all' ? 'notice' : _filter)));
    $('editInfoBtn').addEventListener('click', openInfo);
    $('infoSave').addEventListener('click', saveInfo);
    $('infoCancel').addEventListener('click', closeInfo);
    $('infoOv').addEventListener('click', e => { if (e.target === $('infoOv')) closeInfo(); });
    $('postCancel').addEventListener('click', closePost);
    $('postSubmit').addEventListener('click', submitPost);
    $('postOv').addEventListener('click', e => { if (e.target === $('postOv')) closePost(); });
    $('typeRow').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setType(b.dataset.type); });
    $('pReport').addEventListener('change', function () { $('reportName').textContent = this.files[0] ? this.files[0].name : ''; });
    $('pPhotos').addEventListener('change', function () {
      let files = Array.from(this.files).filter(f => /^image\//.test(f.type));
      if (files.length > MAX_PHOTOS) { toast(`Only the first ${MAX_PHOTOS} photos were kept.`); files = files.slice(0, MAX_PHOTOS); }
      _pfiles = files; renderPreviews();
    });
    $('lbX').addEventListener('click', closeLb);
    $('lbPrev').addEventListener('click', () => lbStep(-1));
    $('lbNext').addEventListener('click', () => lbStep(1));
    $('lb').addEventListener('click', e => { if (e.target === $('lb')) closeLb(); });
    document.addEventListener('keydown', e => {
      if (!$('lb').classList.contains('open')) return;
      if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') lbStep(-1); else if (e.key === 'ArrowRight') lbStep(1);
    });
    let _tx = null;
    $('lb').addEventListener('touchstart', e => { _tx = e.touches[0].clientX; }, { passive: true });
    $('lb').addEventListener('touchend', e => {
      if (_tx === null) return;
      const dx = e.changedTouches[0].clientX - _tx; _tx = null;
      if (Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1);
    }, { passive: true });
    window.addEventListener('resize', syncHeader);

    auth.onAuthStateChanged(async user => {
      _user = user; syncHeader();
      await Promise.all([loadMe(), loadMyOfficer()]);
      paintJoin(); paintAbout(); paintFab();
      if (_feedOnce) loadFeed(true);                 // sign-in changes who can see minutes
    });

    /* ── Start ─────────────────────────────────────── */
    paintHero(); syncHeader(); paintJoin(); paintAbout();
    _membersReady = loadMembers().catch(e => {
      console.warn('[members]', e);
      $('memberGrid').innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">⚠️</div><b>Could not load members</b>Check your connection and try again.</div>';
    });
    loadInfo(); loadGallery(); loadActs();
    const start = (location.hash || '').replace('#', '');
    setTab(['about', 'feed', 'members', 'gallery'].includes(start) ? start : 'about');
  })();
  </script>
</body>
