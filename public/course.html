<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a1628">
  <title>Course — GLUK Yearbook 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="course">

  <div class="user-bar" id="userBar"></div>

  <nav class="top-bar">
    <button class="back-btn" onclick="goBack()" aria-label="Back">‹</button>
    <div style="flex:1">
      <h1 id="topBarTitle">Course<span class="subtitle">GLUK Yearbook 2026</span></h1>
    </div>
    <div class="logo-sm">G</div>
  </nav>

  <div class="page-hero">
    <div class="breadcrumb">
      <a href="index.html" style="color:rgba(255,255,255,.6)">Home</a>
      <span>›</span>
      <a id="deptLink" style="color:rgba(255,255,255,.6)">Dept</a>
      <span>›</span>
      <span id="courseBreadcrumb">Course</span>
    </div>
    <h1 id="courseTitle">Clinical Medicine</h1>
    <p id="courseDesc">Select a class to view the yearbook</p>
  </div>

  <div class="list-container" id="classList"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
  (function(){
    const p      = new URLSearchParams(window.location.search);
    const dept   = p.get('dept')   || 'Health Sciences';
    const course = p.get('course') || 'Clinical Medicine';
    document.getElementById('topBarTitle').innerHTML  = course + '<span class="subtitle">GLUK Yearbook 2026</span>';
    document.getElementById('courseTitle').textContent      = course;
    document.getElementById('courseBreadcrumb').textContent = course;
    const dl = document.getElementById('deptLink');
    dl.textContent = dept;
    dl.href = `department.html?dept=${encodeURIComponent(dept)}`;
    const classes = [
      {year:'2026', label:'Class of 2026', sub:'Final Year — Graduating November 2026', icon:'🎓', badge:'Graduating!'},
      {year:'2027', label:'Class of 2027', sub:'Third Year',                            icon:'📘', badge:'3rd Year'},
      {year:'2028', label:'Class of 2028', sub:'Second Year',                           icon:'📗', badge:'2nd Year'},
      {year:'2029', label:'Class of 2029', sub:'First Year — Freshers',                 icon:'🌟', badge:'1st Year'},
    ];
    document.getElementById('courseDesc').textContent = '4 classes available';
    document.getElementById('classList').innerHTML = classes.map((c,i) => `
      <a class="list-item slide-in"
        href="class.html?dept=${encodeURIComponent(dept)}&course=${encodeURIComponent(course)}&class=${c.year}"
        style="animation-delay:${i*.1}s">
        <div class="list-num">${c.icon}</div>
        <div class="list-info">
          <div class="list-title">${c.label}</div>
          <div class="list-sub">${c.sub}</div>
        </div>
        <span style="background:var(--gold-pale);color:var(--blue);font-size:.65rem;font-weight:700;padding:3px 10px;border-radius:20px;flex-shrink:0">${c.badge}</span>
      </a>`).join('');
  })();
  </script>
</body>
</html>
