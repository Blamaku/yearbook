<body data-page="reel" class="rl-body">

  <!-- The final reel (reel.js): every Class of 2026 graduate with a photo, one after another, then the last line.
       It plays from graduation day, Saturday 21 November (reel.html?preview=1 plays it before then). -->
  <main class="rl" id="rl">
    <a class="rl-x" href="grad.html" aria-label="Back to graduation week">✕</a>
    <div class="rl-stage" id="rlStage" aria-live="polite"></div>
    <div class="rl-bar" aria-hidden="true"><i id="rlBar"></i></div>
    <div class="rl-ctl" id="rlCtl" hidden>
      <button type="button" id="rlPause" aria-label="Pause">❚❚</button>
      <button type="button" id="rlSkip">Skip to the end ›</button>
    </div>
  </main>
