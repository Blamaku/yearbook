<body data-page="glowup">

  <div class="user-bar" id="userBar"></div>

  <!-- Glow Up: Then vs Now (graduation week, day 2). glowup.js fills it; the api (glow.*) saves it;
       the gallery is the public glowups_wall view, empty until Monday 16 November. -->
  <main class="ab gu">
    <header class="ab-hero">
      <a class="ab-back" href="grad.html">‹ Graduation week</a>
      <div class="hm-crest-ring ab-ring"><span class="hm-aura" aria-hidden="true"></span><span class="sp-trophy" aria-hidden="true">✨</span></div>
      <p class="hm-uni">Graduation week · Day 2</p>
      <h1>Glow Up: Then vs Now</h1>
      <p class="ab-place" id="guPlace">Your first year next to now. The gallery opens on Monday 16 November.</p>
    </header>

    <section class="ab-sec" id="yours">
      <h2>Your Glow Up</h2>
      <div class="lt-card" id="guMine"><div class="lt-quiet">Loading…</div></div>
    </section>

    <section class="ab-sec" id="gallery">
      <h2>The gallery</h2>
      <div id="guWall"><div class="lt-card lt-quiet">Loading…</div></div>
    </section>
  </main>

  <input type="file" accept="image/*" id="guFile" hidden>
