<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#061020">
  <meta name="robots" content="noindex">
  <meta name="description" content="Office dashboards of the GLUK Yearbook, for the university's offices.">
  <title>Office dashboard — GLUK Yearbook 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="office">

  <div class="user-bar" id="userBar"></div>

  <!-- One page for every office: it shows the dashboard of the office the signed-in person belongs to
       (api office.me). The super admin sees every office and can switch between them. -->
  <main class="of-main">
    <header class="of-hero">
      <a class="ab-back" href="index.html">‹ Home</a>
      <h1 id="ofTitle">Office dashboard</h1>
      <p id="ofSub">For the university offices that use the GLUK Yearbook.</p>
    </header>
    <div class="of-seg" id="ofSeg" role="tablist" hidden></div>
    <section id="ofBody" aria-live="polite"><div class="of-card"><p>Loading…</p></div></section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script src="office.js"></script>
</body>
</html>
